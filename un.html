<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aperçu – photo sur bande verticale</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--text:#0f172a;--text2:#475569;--primary:#4f46e5;--primary-l:#6366f1;--secondary:#22d3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--text:#f8fafc;--text2:#cbd5e1;--primary:#6366f1;--primary-l:#818cf8}}
:root[data-theme="dark"]{--bg:#0f172a;--text:#f8fafc;--text2:#cbd5e1;--primary:#6366f1;--primary-l:#818cf8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center}
.hero{width:100%;max-width:1100px;margin:0 auto;padding:60px 28px;display:flex;align-items:center;justify-content:space-between;gap:50px}
.txt{flex:1}
.txt h4{font-weight:400;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-bottom:12px}
.txt h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.25;text-transform:uppercase;font-weight:800;margin-bottom:18px}
.txt h1 span{background:linear-gradient(90deg,var(--primary),var(--secondary),var(--primary-l));-webkit-background-clip:text;background-clip:text;color:transparent}
.txt p{color:var(--text2);max-width:520px;font-size:1.1rem}
.note{margin-top:26px;font-size:.85rem;color:var(--text2);opacity:.8}
.flex2{flex:1;display:flex;justify-content:center}
.stage{position:relative;width:min(400px,100%);height:600px;isolation:isolate}
.band{position:absolute;z-index:-1;left:50%;top:0;bottom:0;width:64%;transform:translateX(-50%);
background:linear-gradient(180deg,var(--primary),var(--secondary));
clip-path:polygon(0 0,100% 0,100% 100%,50% 94%,0 100%)}
.band-thin{position:absolute;z-index:-1;left:50%;top:6%;bottom:6%;width:7%;transform:translateX(-178%);background:var(--secondary);opacity:.55;
clip-path:polygon(0 0,100% 0,100% 100%,50% 95%,0 100%)}
.photo{position:absolute;left:50%;top:12%;width:84%;margin-left:-42%;border-radius:22px;display:block;
border:6px solid var(--bg);box-shadow:0 22px 40px rgba(15,23,42,.35);animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media (max-width:820px){.hero{flex-direction:column-reverse;text-align:center;gap:30px}.txt p{margin:0 auto}.stage{height:540px}}
@media (prefers-reduced-motion:reduce){.photo{animation:none}}
</style>
</head>

    <p class="note">Aperçu : bande verticale en dégradé, photo superposée qui flotte doucement.</p>
